# Install, astro check, lint, format check, build, size guard and the Playwright
# smoke tests on every push and PR. The steps live in scripts/ci.sh (commands
# from deploy.config).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read # @abrycta/akari on GitHub Packages

# Branches and PRs: a newer push cancels the older run. main: never cancelled or replaced (each run has its own
# group), so every merged commit gets a finished CI run and the deploy that follows it ("Merged means deployed").
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Authenticate to GitHub Packages (@abrycta)
        run: |
          {
            echo "@abrycta:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}"
          } > .npmrc

      # Playwright: the browser is cached per Playwright version, so a cache hit downloads nothing and only the OS
      # packages come from apt. Each install is bounded (2.5 min per attempt, one retry, step timeout) and apt is
      # kept fast (no Microsoft source, 30 s network timeouts), so a stalled mirror or download fails in minutes
      # with a clear error instead of using up the job.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Playwright OS packages (and the browser on a cache miss)
        timeout-minutes: 6
        env:
          PW_VERSION: ${{ steps.pw.outputs.version }}
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\nDPkg::Lock::Timeout "60";\n' |
            sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          bounded() { # bounded <what>: <command...> — 150 s per attempt, one retry
            local what=$1; shift
            for i in 1 2; do
              timeout -k 10 150 "$@" && return 0
              echo "::warning::$what failed or stalled (attempt $i of 2)"
            done
            echo "::error title=Playwright install::$what failed twice (2.5 min per attempt); see the log above"
            return 1
          }
          bounded "OS packages (apt)" npx --yes "playwright@$PW_VERSION" install-deps chromium
          if [ "$CACHE_HIT" = true ]; then
            echo "Playwright $PW_VERSION browser restored from cache: no download."
          else
            bounded "Browser download" npx --yes "playwright@$PW_VERSION" install chromium
          fi

      - name: Install, check, build, size guard, smoke tests
        run: bash scripts/ci.sh --clean
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
