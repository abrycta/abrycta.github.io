# Build with withastro/action and publish to GitHub Pages (custom domain from
# public/CNAME). Repo settings: Pages > Build and deployment > Source: GitHub Actions.
#
# Merged means deployed (portfolio rules 17 and 24): this runs whenever CI finishes on main (and by hand or from
# live-check.yml), and always deploys main's NEWEST commit once that commit's CI is green
# (.github/scripts/deploy-gate.sh): a run triggered by an older commit deploys the newest one, so nothing merged is
# ever left behind; if the newest commit's CI is still running, its own completion deploys it; if it is red, this
# run fails (red, never grey). Each deploy writes /deploy.json with the deployed commit for live-check.yml.
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read # @abrycta/akari on GitHub Packages
  actions: read # CI's result for main's newest commit

# One deployment at a time, never cancelled midway. A newer pending run may replace an older pending one; both
# would deploy main's newest commit, so nothing is lost.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    name: Newest main commit is green
    # PR CI runs never deploy (they also never reach here: branches: [main] filters on the head branch).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - name: Which commit to deploy
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/deploy-gate.sh ci.yml

  build:
    name: Build
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Read by the .npmrc below during the action's `npm ci`.
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Authenticate to GitHub Packages (@abrycta)
        run: |
          {
            echo "@abrycta:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}"
          } > .npmrc

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      # Keep the previous deploys' hashed assets, so pages that browsers cached before this deploy (GitHub Pages
      # allows 10 minutes) still find their stylesheets and scripts instead of rendering unstyled.
      - name: Restore earlier assets
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .asset-store
          key: pages-assets-${{ github.run_id }}
          restore-keys: pages-assets-

      - name: Record the deployed commit (/deploy.json, read by live-check.yml)
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: printf '{"sha":"%s","run":"%s/%s/actions/runs/%s"}\n' "$SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/deploy.json

      - name: Retain earlier assets
        run: node scripts/retain-assets.mjs dist .asset-store https://krtmtthw.dev

      - name: Save assets for the next deploy
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .asset-store
          key: pages-assets-${{ github.run_id }}

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
