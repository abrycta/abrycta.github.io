# Build with withastro/action and publish to GitHub Pages (custom domain from
# public/CNAME). Repo settings: Pages > Build and deployment > Source: GitHub Actions.
#
# Deploys follow CI (portfolio rule 17): this runs when the CI workflow finishes for a push to main, and
# only when that run succeeded; it builds exactly the commit CI verified (workflow_run.head_sha). A manual
# run (workflow_dispatch) deploys main's tip only if CI already succeeded for that commit.
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read # @abrycta/akari on GitHub Packages
  actions: read # workflow_dispatch: look up CI's result for the commit

# One deployment at a time and never cancelled midway. While one runs, GitHub keeps only the newest
# pending run of the group, so stacked pushes deploy just the newest commit. CI itself cancels superseded
# runs on main, so CI successes (and so deploys) arrive in commit order. Runs for a failed or cancelled CI
# get a group of their own, so they never displace a pending deploy of a green commit.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' &&
    github.event.workflow_run.event == 'push')) && 'pages' || format('pages-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  gate:
    name: CI passed
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Commit CI verified
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -n "$RUN_SHA" ]; then
            sha="$RUN_SHA"
            echo "CI passed for \`${sha:0:7}\`: $RUN_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            sha="$GITHUB_SHA"
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success" --jq '.total_count')
            if [ "$ok" = 0 ]; then
              echo "::error title=CI has not passed::No successful CI push run for $sha; not deploying."
              exit 1
            fi
            echo "Manual deploy of \`${sha:0:7}\` (CI passed for it)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Read by the .npmrc below during the action's `npm ci`.
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Authenticate to GitHub Packages (@abrycta)
        run: |
          {
            echo "@abrycta:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}"
          } > .npmrc

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      # Keep the previous deploys' hashed assets, so pages that browsers cached before this deploy (GitHub Pages
      # allows 10 minutes) still find their stylesheets and scripts instead of rendering unstyled.
      - name: Restore earlier assets
        uses: actions/cache/restore@v6
        with:
          path: .asset-store
          key: pages-assets-${{ github.run_id }}
          restore-keys: pages-assets-

      - name: Retain earlier assets
        run: node scripts/retain-assets.mjs dist .asset-store https://krtmtthw.dev

      - name: Save assets for the next deploy
        uses: actions/cache/save@v6
        with:
          path: .asset-store
          key: pages-assets-${{ github.run_id }}

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
