# Build with withastro/action and publish to GitHub Pages (custom domain from
# public/CNAME). Repo settings: Pages > Build and deployment > Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read # @abrycta/akari on GitHub Packages

# One deployment at a time; never cancel one that is running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Read by the .npmrc below during the action's `npm ci`.
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GitHub Packages (@abrycta)
        run: |
          {
            echo "@abrycta:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}"
          } > .npmrc

      - name: Install, build and upload the Pages artifact
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
