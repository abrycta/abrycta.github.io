# Dependency updates (Dependabot, MAINTAINING.md rule 24). Weekly version updates: minor and patch grouped into
# one PR per ecosystem and directory, at most 2 open. Security fixes come as their own grouped PR (repo setting:
# Dependabot security updates).
# Majors of react, react-dom, astro, vite and maplibre-gl are upgraded by hand; @abrycta/* (Akari) only through
# the per-release upgrade PR (rule 16).
version: 2
registries:
  # @abrycta/akari comes from GitHub Packages. Dependabot secret DEPENDABOT_PACKAGES_TOKEN: a classic
  # personal access token with read:packages only.
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    # Dependabot needs the scope (.npmrc is gitignored here); without it every npm job fails with
    # private_registry_config_not_found.
    scope: "@abrycta"
    token: ${{secrets.DEPENDABOT_PACKAGES_TOKEN}}
updates:
  - package-ecosystem: npm
    directories: ["/"]
    registries: [github-packages]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    open-pull-requests-limit: 2
    groups:
      npm:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "@abrycta/*"
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: astro
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: maplibre-gl
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directories: ["/"]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    open-pull-requests-limit: 2
    groups:
      github-actions:
        applies-to: version-updates
        update-types: [minor, patch]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
